<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Область экрана Карины</title>
<link rel="stylesheet" href="fonts.css">
<style>
:root{--c:#6ab3f3;--fg:#f2f2f6;--muted:#9a9cae;--card2:#202027;--card3:#2b2b34}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#000;user-select:none;-webkit-user-select:none;cursor:crosshair;font:500 12.5px/1.3 'Onest',system-ui,'Segoe UI',sans-serif;color:var(--fg)}
#bg{position:fixed;inset:0;width:100vw;height:100vh;display:block}
#dim{position:fixed;inset:0;background:rgba(10,14,30,.45)}
#sel{position:fixed;display:none;border:2px solid var(--c);box-shadow:0 0 0 100vmax rgba(10,14,30,.45);background:transparent;z-index:2;cursor:move}
#sel i{position:absolute;width:9px;height:9px;background:#fff;border:1.5px solid var(--c)}
#sel i[data-h=nw]{left:-6px;top:-6px;cursor:nwse-resize}#sel i[data-h=ne]{right:-6px;top:-6px;cursor:nesw-resize}
#sel i[data-h=sw]{left:-6px;bottom:-6px;cursor:nesw-resize}#sel i[data-h=se]{right:-6px;bottom:-6px;cursor:nwse-resize}
#sel i[data-h=n]{left:calc(50% - 5px);top:-6px;cursor:ns-resize}#sel i[data-h=s]{left:calc(50% - 5px);bottom:-6px;cursor:ns-resize}
#sel i[data-h=w]{left:-6px;top:calc(50% - 5px);cursor:ew-resize}#sel i[data-h=e]{right:-6px;top:calc(50% - 5px);cursor:ew-resize}
.pill{position:fixed;z-index:5;background:#000;color:var(--fg);border-radius:8px;padding:3px 9px;font:500 11.5px 'JetBrains Mono',monospace;pointer-events:none;white-space:nowrap}
#bar{position:fixed;z-index:6;display:none;gap:6px;background:#000;border-radius:16px;padding:6px;cursor:default}
.btn{padding:7px 12px;border-radius:12px;background:var(--card2);font:600 12px 'Onest',sans-serif;color:var(--fg);border:0;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--card3)}.btn.p{background:var(--c);color:#06121f}.btn.p:hover{filter:brightness(1.08)}
#hint{position:fixed;left:50%;top:18px;transform:translateX(-50%);z-index:5;background:#000;border-radius:99px;padding:7px 16px;color:var(--muted);font-weight:600;pointer-events:none;white-space:nowrap}
#hint b{color:var(--fg)}
/* пипетка */
#loupe{position:fixed;z-index:7;display:none;width:138px;height:138px;border-radius:50%;border:3px solid #000;box-shadow:0 6px 20px rgba(0,0,0,.45);overflow:hidden;pointer-events:none;background:#000}
#loupe canvas{width:100%;height:100%;display:block}
#live{position:fixed;z-index:7;display:none;background:#000;border-radius:10px;padding:4px 9px;font:600 12px 'JetBrains Mono',monospace;pointer-events:none}
#card{position:fixed;z-index:8;display:none;background:#000;border-radius:16px;padding:12px 14px;width:236px;cursor:default;box-shadow:0 8px 28px rgba(0,0,0,.4)}
#card .top{display:flex;gap:10px;align-items:center}
#card .sw{width:34px;height:34px;border-radius:9px;flex:none;box-shadow:inset 0 0 0 1px rgba(255,255,255,.18)}
#card b{font:600 14px 'JetBrains Mono',monospace}#card small{display:block;color:var(--muted);font-size:11px;margin-top:2px}
#card .row{display:flex;gap:6px;margin-top:10px}#card .btn{padding:5px 10px}
.mut{color:var(--muted)}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<div id="dim"></div>
<div id="sel"><i data-h="nw"></i><i data-h="n"></i><i data-h="ne"></i><i data-h="e"></i><i data-h="se"></i><i data-h="s"></i><i data-h="sw"></i><i data-h="w"></i></div>
<div class="pill" id="size" style="display:none"></div>
<div id="bar"><button class="btn p" data-a="copy">Копировать</button><button class="btn" data-a="save">Сохранить</button><button class="btn" data-a="text">Текст</button><button class="btn" data-a="cancel">✕</button></div>
<div id="hint"></div>
<div id="loupe"><canvas id="lc" width="132" height="132"></canvas></div>
<div id="live"></div>
<div id="card"><div class="top"><span class="sw" id="cSw"></span><div><b id="cHex"></b><small id="cRgb"></small></div></div>
  <div class="row"><button class="btn p" id="cCopyHex">Копировать HEX</button><button class="btn" id="cCopyRgb">RGB</button></div></div>
<script>
(() => {
  'use strict';
  const $ = id => document.getElementById(id);
  let api = null, mode = 'area', img = null, W = 0, H = 0;     // W, H — размер снимка в пикселях
  const call = async (n, ...a) => { try { return await api[n](...a); } catch (e) { return null; } };
  const bg = $('bg'), sel = $('sel'), bar = $('bar'), size = $('size'), hint = $('hint');
  let sx = 0, sy = 0, ex = 0, ey = 0, drag = null, has = false, finished = false;
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const vw = () => window.innerWidth, vh = () => window.innerHeight;

  function paintSel() {
    const x0 = Math.min(sx, ex), y0 = Math.min(sy, ey), x1 = Math.max(sx, ex), y1 = Math.max(sy, ey);
    Object.assign(sel.style, { display: has ? 'block' : 'none', left: x0 + 'px', top: y0 + 'px', width: (x1 - x0) + 'px', height: (y1 - y0) + 'px' });
    $('dim').style.display = has ? 'none' : 'block';
    if (!has) { size.style.display = 'none'; return; }
    const pw = Math.round((x1 - x0) * W / vw()), ph = Math.round((y1 - y0) * H / vh());
    size.textContent = pw + ' × ' + ph; size.style.display = 'block';
    size.style.left = x0 + 'px'; size.style.top = Math.max(4, y0 - 28) + 'px';
    if (!drag) {
      bar.style.display = mode === 'area' ? 'flex' : 'none';
      const bw = bar.offsetWidth, bh = bar.offsetHeight;
      bar.style.left = clamp(x0, 6, vw() - bw - 6) + 'px';
      bar.style.top = (y1 + 10 + bh > vh() ? Math.max(6, y0 - bh - 36) : y1 + 10) + 'px';
    } else bar.style.display = 'none';
  }
  const rect = () => [Math.min(sx, ex) / vw(), Math.min(sy, ey) / vh(), Math.max(sx, ex) / vw(), Math.max(sy, ey) / vh()];
  async function finish(action, extra) {
    if (finished) return; finished = true;
    await call('done', Object.assign({ action, rect: has ? rect() : null }, extra || {}));
  }
  const cancel = () => finish('cancel');

  // ---------- выбор области ----------
  document.addEventListener('mousedown', e => {
    if (e.button === 2) { cancel(); return; }
    if (mode === 'pick' || e.target.closest('#bar') || e.target.closest('#card')) return;
    const h = e.target.closest('#sel i');
    if (h && has) { drag = { t: 'h', h: h.dataset.h }; }
    else if (e.target === sel && has) { drag = { t: 'm', ox: e.clientX, oy: e.clientY, s: [sx, sy, ex, ey] }; }
    else { sx = ex = e.clientX; sy = ey = e.clientY; has = true; drag = { t: 'n' }; hint.style.display = 'none'; }
    paintSel();
  });
  document.addEventListener('mousemove', e => {
    if (mode === 'pick') return pickMove(e);
    if (!drag) return;
    const x = clamp(e.clientX, 0, vw()), y = clamp(e.clientY, 0, vh());
    if (drag.t === 'n') { ex = x; ey = y; }
    else if (drag.t === 'm') {
      const [a, b, c, d] = drag.s, dx = clamp(e.clientX - drag.ox, -Math.min(a, c), vw() - Math.max(a, c)), dy = clamp(e.clientY - drag.oy, -Math.min(b, d), vh() - Math.max(b, d));
      sx = a + dx; ex = c + dx; sy = b + dy; ey = d + dy;
    } else {
      const x0 = Math.min(sx, ex), x1 = Math.max(sx, ex), y0 = Math.min(sy, ey), y1 = Math.max(sy, ey), h = drag.h;
      let nx0 = x0, nx1 = x1, ny0 = y0, ny1 = y1;
      if (h.includes('w')) nx0 = x; if (h.includes('e')) nx1 = x; if (h.includes('n')) ny0 = y; if (h.includes('s')) ny1 = y;
      sx = nx0; ex = nx1; sy = ny0; ey = ny1;
    }
    paintSel();
  });
  document.addEventListener('mouseup', () => {
    if (mode === 'pick' || !drag) return;
    drag = null;
    if (Math.abs(ex - sx) < 6 || Math.abs(ey - sy) < 6) { has = false; paintSel(); hint.style.display = ''; return; }
    paintSel();
    if (mode === 'text') finish('text');
  });
  bar.addEventListener('click', e => { const b = e.target.closest('button'); if (b) b.dataset.a === 'cancel' ? cancel() : finish(b.dataset.a); });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') cancel();
    else if (mode === 'area' && has && !drag && e.key === 'Enter') finish('copy');
    else if (mode === 'pick' && last) {
      const d = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] }[e.key];
      if (d) { e.preventDefault(); nudge(d[0], d[1]); }
      else if (e.key === 'Enter') pickAt(px, py);
    }
  });

  // ---------- пипетка ----------
  const lc = $('lc'), lx = lc.getContext('2d'), N = 11, CELL = 12;
  let off = null, ox = null, px = 0, py = 0, last = null, fixed = false;
  function toImg(cx, cy) { return [clamp(Math.floor(cx * W / vw()), 0, W - 1), clamp(Math.floor(cy * H / vh()), 0, H - 1)]; }
  function readPx(x, y) { const d = ox.getImageData(x, y, 1, 1).data; return [d[0], d[1], d[2]]; }
  const hex = c => '#' + c.map(v => v.toString(16).padStart(2, '0')).join('').toUpperCase();
  function drawLoupe(x, y) {
    lx.imageSmoothingEnabled = false; lx.fillStyle = '#000'; lx.fillRect(0, 0, 132, 132);
    lx.drawImage(off, x - 5, y - 5, N, N, 0, 0, N * CELL, N * CELL);
    lx.strokeStyle = 'rgba(0,0,0,.18)'; lx.lineWidth = 1; lx.beginPath();
    for (let i = 0; i <= N; i++) { lx.moveTo(i * CELL + .5, 0); lx.lineTo(i * CELL + .5, 132); lx.moveTo(0, i * CELL + .5); lx.lineTo(132, i * CELL + .5); }
    lx.stroke();
    lx.strokeStyle = '#000'; lx.lineWidth = 3; lx.strokeRect(5 * CELL + 1.5, 5 * CELL + 1.5, CELL - 3, CELL - 3);
    lx.strokeStyle = '#fff'; lx.lineWidth = 1.5; lx.strokeRect(5 * CELL + 1.5, 5 * CELL + 1.5, CELL - 3, CELL - 3);
  }
  function pickMove(e) {
    if (fixed) return;
    const [x, y] = toImg(e.clientX, e.clientY); px = x; py = y; showLoupe(e.clientX, e.clientY);
  }
  function showLoupe(cx, cy) {
    last = readPx(px, py); drawLoupe(px, py);
    const lp = $('loupe'), lv = $('live');
    lp.style.display = lv.style.display = 'block';
    const lxp = cx + 24 + 138 > vw() ? cx - 24 - 138 : cx + 24, lyp = cy + 24 + 138 + 30 > vh() ? cy - 24 - 138 - 30 : cy + 24;
    lp.style.left = lxp + 'px'; lp.style.top = lyp + 'px';
    lv.textContent = hex(last); lv.style.left = lxp + 'px'; lv.style.top = (lyp + 144) + 'px';
    lv.style.borderLeft = '12px solid ' + hex(last);
    lp._cx = cx; lp._cy = cy;
  }
  function nudge(dx, dy) {
    px = clamp(px + dx, 0, W - 1); py = clamp(py + dy, 0, H - 1);
    const lp = $('loupe'); showLoupe(lp._cx + dx * vw() / W, lp._cy + dy * vh() / H);
  }
  document.addEventListener('click', e => { if (mode === 'pick' && !fixed && !e.target.closest('#card')) pickAt(px, py, e); });
  function pickAt(x, y) {
    if (fixed) return; fixed = true;
    const c = readPx(x, y), card = $('card'), lp = $('loupe');
    $('cSw').style.background = hex(c); $('cHex').textContent = hex(c); $('cRgb').textContent = `rgb(${c.join(', ')})`;
    card.style.display = 'block';
    const lxp = parseFloat(lp.style.left), lyp = parseFloat(lp.style.top);
    card.style.left = clamp(lxp + 150 > vw() - 240 ? lxp - 250 : lxp + 150, 6, vw() - 242) + 'px'; card.style.top = clamp(lyp + 20, 6, vh() - 110) + 'px';
    $('live').style.display = 'none'; hint.innerHTML = 'Esc — закрыть';
    card.dataset.hex = hex(c); card.dataset.rgb = `rgb(${c.join(', ')})`;
  }
  $('cCopyHex').onclick = async () => { await call('done', { action: 'color', value: $('card').dataset.hex }); finished = true; };
  $('cCopyRgb').onclick = async () => { await call('done', { action: 'color', value: $('card').dataset.rgb }); finished = true; };

  // ---------- запуск ----------
  async function init() {
    api = window.pywebview.api;
    const r = await call('image');
    if (!r || !r.url) { cancel(); return; }
    mode = r.mode || 'area';
    img = new Image();
    img.onload = () => {
      W = img.naturalWidth; H = img.naturalHeight;
      bg.width = W; bg.height = H; bg.getContext('2d').drawImage(img, 0, 0);
      if (mode === 'pick') {
        off = document.createElement('canvas'); off.width = W; off.height = H;
        ox = off.getContext('2d', { willReadFrequently: true }); ox.drawImage(img, 0, 0);
        $('dim').style.display = 'none';
        hint.innerHTML = '<b>Пипетка</b> · клик — взять цвет · стрелки — на пиксель · Esc — отмена';
      } else hint.innerHTML = mode === 'text' ? '<b>Текст с экрана</b> · выделите область с надписью · Esc — отмена' : '<b>Область</b> · выделите мышью · Esc — отмена';
      call('ready');
    };
    img.src = r.url;
  }
  if (window.pywebview && window.pywebview.api) init(); else window.addEventListener('pywebviewready', init);
})();
</script>
</body>
</html>
