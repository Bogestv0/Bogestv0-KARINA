<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Остров Карины</title>
<link rel="stylesheet" href="fonts.css">
<style>
:root{--c:#6ab3f3;--fg:#f2f2f6;--muted:#9a9cae;--card:#17171c;--card2:#202027;--card3:#2b2b34}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000;color:var(--fg);overflow:hidden;user-select:none;-webkit-user-select:none;cursor:default;
  font:500 13px/1.3 'Onest',system-ui,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit;border:0;background:none}
button{cursor:pointer}
input,textarea{user-select:text;-webkit-user-select:text;cursor:text;outline:0}
[hidden]{display:none!important}
/* --r — тот же радиус, что считает Python (island.py: RADIUS_MAX): min(30px, половина высоты). Кромка в 1px — сглаженный контур окна (halo.py) */
#root{--r:min(30px,50vh);position:relative;width:100%;height:100%;overflow:hidden;border-radius:var(--r)}
#root::after{content:"";position:absolute;inset:1px;border-radius:calc(var(--r) - 1px);pointer-events:none;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--c) 38%,transparent);transition:box-shadow .35s;z-index:9}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-thumb{background:#3a3a44;border-radius:3px}

/* ---------- персонаж ---------- */
.chr{display:block;flex:none;position:relative}
.chr svg{width:100%;height:100%;display:block;overflow:visible}
.chr img{width:100%;height:100%;border-radius:28%;display:block}
.sm{width:24px;height:24px}.lg{width:30px;height:30px}.xl{width:54px;height:54px}
.eye{transform-box:fill-box;transform-origin:center;animation:blink 4.6s infinite}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.12)}}
.s-thinking .eye{animation:look 1.1s ease-in-out infinite}
@keyframes look{0%,100%{transform:translateX(-1.6px)}50%{transform:translateX(1.6px)}}
.s-speaking .eye{animation:talk .35s ease-in-out infinite alternate}
@keyframes talk{to{transform:scaleY(.7)}}
.s-sleep .eye,.s-paused .eye{animation:none;transform:scaleY(.14)}
.s-error .eye{animation:none;transform:scale(1.15)}
.fillc{fill:var(--c);transition:fill .3s}
.s-thinking .chr{animation:spin 1.2s ease-in-out infinite}
.s-speaking .chr{animation:pulse .7s ease-in-out infinite}
.s-loading .chr{animation:pulse 1.4s ease-in-out infinite;opacity:.85}
.s-sleep .chr,.s-paused .chr{filter:grayscale(.9) brightness(.7)}
.s-error #root{animation:shake .45s}
@keyframes pulse{50%{transform:scale(1.1)}}
@keyframes spin{50%{transform:scale(.88) rotate(-6deg)}}
@keyframes shake{20%,60%{transform:translateX(-3px)}40%,80%{transform:translateX(3px)}}

/* ---------- компактный вид ---------- */
.compact{position:absolute;inset:0;display:flex;align-items:center;gap:9px;padding:0 12px 0 7px;opacity:1;transition:opacity .18s .1s;z-index:2}
.m-full .compact{opacity:0;pointer-events:none;transition-delay:0s}
.txt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12.5px;opacity:0;transition:opacity .2s}
.m-wide .txt{opacity:1}
.txt b{color:var(--c);font-weight:600;margin-right:6px}
.txt span{color:var(--muted)}
.bars{display:flex;gap:2px;align-items:center;height:18px;margin-left:auto;flex:none}
.bars i{width:3px;height:3px;border-radius:2px;background:var(--c);transition:height .1s,background .3s}

/* ---------- панель ---------- */
.full{position:absolute;left:50%;top:0;width:480px;height:330px;transform:translateX(-50%);opacity:0;pointer-events:none;transition:opacity .2s;z-index:3}
.m-full .full{opacity:1;pointer-events:auto;transition-delay:.12s}
.bar{display:flex;align-items:center;gap:2px;height:46px;padding:8px 12px 0 14px}
.tab{width:34px;height:30px;border-radius:10px;display:grid;place-items:center;color:var(--muted);transition:background .15s,color .15s}
.tab:hover{background:var(--card2);color:var(--fg)}
.tab.on{background:var(--card3);color:var(--fg)}
.tab svg,.fold svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.chip{margin-left:auto;display:flex;align-items:center;gap:7px;padding:4px 11px;border-radius:99px;background:var(--card2);font-size:12px;font-weight:600;color:var(--c);white-space:nowrap}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--c);box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 25%,transparent)}
.fold{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;color:var(--muted);margin-left:4px}
.fold:hover{background:var(--card2);color:var(--fg)}
.pane{position:absolute;left:0;right:0;top:46px;bottom:0;padding:8px 14px 14px;display:none}
.pane.on{display:block;animation:in .22s ease both}
@keyframes in{from{opacity:0;transform:translateY(4px)}}
.row{display:flex;gap:8px;align-items:center}
.btn{padding:8px 12px;border-radius:12px;background:var(--card2);font-weight:600;font-size:12px;white-space:nowrap;transition:background .15s,transform .1s}
.btn:hover{background:var(--card3)}.btn:active{transform:scale(.97)}
.btn.p{background:var(--c);color:#06121f}.btn.p:hover{filter:brightness(1.08)}
.btn.warn{background:#5a2420;color:#ffd7d3}
.muted{color:var(--muted)}
.card{background:var(--card);border-radius:16px;padding:12px}
h4{margin:0 0 6px;font:600 11px 'Onest',sans-serif;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}

/* главная */
.hero{display:flex;gap:14px;align-items:center}
.hero .main{font:600 17px/1.25 'Onest',sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hero .sub{color:var(--muted);font-size:12px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:16px}
.hero>div:last-child{min-width:0;flex:1}
.acts{display:flex;gap:8px;margin:14px 0 12px}.acts .btn{flex:1}
.vol{display:flex;align-items:center;gap:10px;padding:10px 12px}
.vol button{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;color:var(--muted)}
.vol button:hover{background:var(--card2);color:var(--fg)}
.vol svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.vol b{width:34px;text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{-webkit-appearance:none;appearance:none;flex:1;height:6px;border-radius:3px;background:linear-gradient(to right,var(--c) var(--p,50%),#34343d var(--p,50%));cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.5)}
.quick{display:flex;gap:8px;margin-top:10px}.quick .btn{flex:1;text-align:center}

/* заметки */
.two{display:grid;grid-template-columns:1fr 190px;gap:10px;height:100%}
.note{width:100%;height:100%;resize:none;background:var(--card);border-radius:16px;padding:12px;line-height:1.45}
.side{display:flex;flex-direction:column;gap:6px;min-height:0}
.ring{position:relative;width:70px;height:70px;margin:0 auto}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:6}
.ring .bg{stroke:#2b2b34}.ring .fg{stroke:var(--c);stroke-linecap:round;transition:stroke-dashoffset .4s linear}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font:600 15px 'Onest',sans-serif;font-variant-numeric:tabular-nums}
.presets{display:flex;gap:4px;justify-content:center}.presets button{padding:3px 7px;border-radius:99px;background:var(--card2);font-size:11px}
.presets button:hover{background:var(--card3)}
.rem{flex:1;overflow:auto;display:flex;flex-direction:column;gap:5px;min-height:0}
.rem div{display:flex;gap:6px;align-items:center;background:var(--card);border-radius:10px;padding:5px 8px;font-size:12px}
.rem span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.rem small{color:var(--muted)}
.rem button{color:var(--muted);width:18px}.rem button:hover{color:#ff8a80}
.inp{width:100%;background:var(--card);border-radius:12px;padding:8px 10px;font-size:12px}

/* буфер */
.clip{height:100%;overflow:auto;display:flex;flex-direction:column;gap:5px}
.clip button{text-align:left;background:var(--card);border-radius:12px;padding:8px 11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12.5px}
.clip button:hover{background:var(--card3)}
.empty{height:100%;display:grid;place-items:center;text-align:center;color:var(--muted);font-size:12.5px;padding:0 24px}

/* погода */
.wnow{display:flex;align-items:center;gap:14px;margin-bottom:8px}
.wnow .big{font:600 36px/1 'Onest',sans-serif}.wnow .ico{font-size:40px;line-height:1}
.wdays{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.wd{background:var(--card);border-radius:12px;padding:7px 2px;text-align:center;font-size:11px}
.wd .i{font-size:19px;margin:3px 0}.wd b{display:block;font-size:12px}
.wcity{display:flex;gap:6px;margin-top:8px}.wcity .inp{flex:1}

/* система */
.tiles{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
.tile{background:var(--card);border-radius:14px;padding:9px;text-align:left;min-height:84px;display:flex;flex-direction:column;justify-content:space-between;transition:background .15s}
.tile:hover{background:var(--card2)}
.tile.on{background:color-mix(in srgb,var(--c) 26%,#17171c)}
.tile svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.tile b{display:block;font-size:12px}.tile small{color:var(--muted);font-size:10.5px}
.power{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:8px}
.power button{background:var(--card);border-radius:14px;padding:12px 4px;font-size:12px;font-weight:600;display:flex;flex-direction:column;gap:5px;align-items:center}
.power button:hover{background:var(--card2)}.power button.ask{background:#5a2420}
.power svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

/* настройки */
.sgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:10px}
.sgrid button{background:var(--card);border-radius:14px;padding:7px 2px;font-size:10.5px;display:flex;flex-direction:column;align-items:center;gap:4px;border:1px solid transparent}
.sgrid button.on{border-color:var(--c);background:var(--card2)}
.seg{display:flex;background:var(--card);border-radius:11px;padding:2px}.seg button{flex:1;padding:6px 4px;border-radius:9px;font-size:12px;color:var(--muted)}.seg button.on{background:var(--card3);color:var(--fg)}
.set{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:5px 0}
.set>span{font-size:12.5px;flex:1}.set .seg{width:210px}

/* подсказка */
.toast{position:absolute;left:14px;right:14px;bottom:12px;padding:9px 12px;border-radius:14px;background:var(--c);color:#06121f;font-weight:600;font-size:12.5px;z-index:8;opacity:0;transform:translateY(8px);pointer-events:none;transition:.25s}
.toast.on{opacity:1;transform:none}

/* праздник */
#snow{position:absolute;inset:0;pointer-events:none;z-index:7}
.garland{position:absolute;left:14px;right:14px;bottom:1px;height:7px;display:flex;justify-content:space-between;pointer-events:none;z-index:8}
.garland i{width:5px;height:5px;border-radius:50%;margin-top:1px}
.garland i:nth-child(4n+1){background:#ff5d5d}.garland i:nth-child(4n+2){background:#ffd24a}.garland i:nth-child(4n+3){background:#58d68d}.garland i:nth-child(4n){background:#5dade2}
.g-blink i{animation:gb 1.2s infinite}.g-blink i:nth-child(odd){animation-delay:.6s}
.g-wave i{animation:gw 1.6s ease-in-out infinite;animation-delay:calc(var(--k)*.1s)}
@keyframes gb{50%{opacity:.25}}@keyframes gw{50%{transform:translateY(-1.5px) scale(1.35);filter:brightness(1.4)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="root" class="m-mini s-loading">
  <canvas id="snow" hidden></canvas>
  <div class="garland" id="garland" hidden></div>

  <div class="compact" id="compact">
    <span class="chr sm" data-chr></span>
    <div class="txt" id="cTxt"><b id="cLab">Запуск</b><span id="cSub"></span></div>
    <div class="bars" id="bars"><i></i><i></i><i></i><i></i><i></i></div>
  </div>

  <div class="full">
    <div class="bar" id="tabs">
      <button class="tab on" data-t="home" title="Главная"><svg viewBox="0 0 16 16"><path d="M2 7.5 8 2.5l6 5M3.5 6.5V13h3.2V9.5h2.6V13h3.2V6.5"/></svg></button>
      <button class="tab" data-t="notes" title="Заметка, таймер, напоминания"><svg viewBox="0 0 16 16"><path d="M3 2.5h8l2 2V13.5H3zM5.5 6.5h5M5.5 9h5M5.5 11.5h3"/></svg></button>
      <button class="tab" data-t="clip" title="Буфер обмена"><svg viewBox="0 0 16 16"><rect x="3" y="3" width="10" height="11" rx="1.6"/><path d="M6 3V2h4v1M5.5 7h5M5.5 9.5h5"/></svg></button>
      <button class="tab" data-t="weather" title="Погода"><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="2.8"/><path d="M8 1.5v1.6M8 12.9v1.6M1.5 8h1.6M12.9 8h1.6M3.4 3.4l1.1 1.1M11.5 11.5l1.1 1.1M3.4 12.6l1.1-1.1M11.5 4.5l1.1-1.1"/></svg></button>
      <button class="tab" data-t="system" title="Система"><svg viewBox="0 0 16 16"><path d="M2.5 4.5h6M11.5 4.5h2M2.5 11.5h2M7.5 11.5h6"/><circle cx="10" cy="4.5" r="1.5"/><circle cx="6" cy="11.5" r="1.5"/></svg></button>
      <button class="tab" data-t="look" title="Вид острова"><svg viewBox="0 0 16 16"><path d="M8 1.8l1.5 3.7 3.9.3-3 2.5 1 3.8L8 10l-3.4 2.1 1-3.8-3-2.5 3.9-.3z"/></svg></button>
      <div class="chip" id="chip"><i></i><span id="chipT">Запуск</span></div>
      <button class="fold" id="fold" title="Свернуть" aria-label="Свернуть"><svg viewBox="0 0 16 16"><path d="M4 10l4-4 4 4"/></svg></button>
    </div>

    <!-- главная -->
    <div class="pane on" id="p-home">
      <div class="hero"><span class="chr xl" data-chr></span>
        <div><div class="main" id="fMain">Загружаюсь…</div><div class="sub" id="fSub"></div></div></div>
      <div class="acts">
        <button class="btn p" id="bMic" type="button">Выключить микрофон</button>
        <button class="btn" id="bStop" type="button" hidden>Стоп</button>
        <button class="btn" id="bOpen" type="button">Открыть Карину</button>
      </div>
      <div class="card vol">
        <button id="bMute" title="Без звука"><svg viewBox="0 0 18 18"><path d="M3 7v4h3l4 3.5v-11L6 7zM13 6.5a4 4 0 0 1 0 5M15 4.5a7 7 0 0 1 0 9"/></svg></button>
        <input type="range" id="vol" min="0" max="100" value="50"><b id="volV">50</b>
      </div>
      <div class="quick"><button class="btn" id="bShot">Снимок экрана</button><button class="btn" id="bShots">Папка снимков</button></div>
    </div>

    <!-- заметки -->
    <div class="pane" id="p-notes">
      <div class="two">
        <textarea class="note" id="note" placeholder="Пиши сюда что угодно: номер заказа, список дел, кусок кода. Сохраняется само." spellcheck="false"></textarea>
        <div class="side">
          <div class="ring"><svg viewBox="0 0 86 86"><circle class="bg" cx="43" cy="43" r="38"/><circle class="fg" id="rFg" cx="43" cy="43" r="38" stroke-dasharray="238.8" stroke-dashoffset="0"/></svg><b id="tTime">5:00</b></div>
          <div class="row" style="justify-content:center"><button class="btn p" id="tGo" style="padding:6px 14px">Старт</button></div>
          <div class="presets" id="presets"><button data-m="5">5</button><button data-m="10">10</button><button data-m="15">15</button><button data-m="25">25</button><button data-m="45">45</button><span class="muted" style="font-size:11px;align-self:center">мин</span></div>
          <h4 style="margin:2px 0 0">Напоминания</h4>
          <div class="rem" id="rem"></div>
          <input class="inp" id="remIn" placeholder="позвонить маме завтра в 9">
        </div>
      </div>
    </div>

    <!-- буфер -->
    <div class="pane" id="p-clip"><div class="clip" id="clip"></div></div>

    <!-- погода -->
    <div class="pane" id="p-weather"><div id="wBody"></div></div>

    <!-- система -->
    <div class="pane" id="p-system">
      <div class="tiles" id="tiles"></div>
      <div class="power" id="power">
        <button data-a="lock"><svg viewBox="0 0 18 18"><rect x="4" y="8" width="10" height="7" rx="1.6"/><path d="M6.5 8V6a2.5 2.5 0 0 1 5 0v2"/></svg>Блокировка</button>
        <button data-a="sleep"><svg viewBox="0 0 18 18"><path d="M14.5 10.5A6 6 0 0 1 7.5 3.5a6 6 0 1 0 7 7z"/></svg>Сон</button>
        <button data-a="restart"><svg viewBox="0 0 18 18"><path d="M14.5 9a5.5 5.5 0 1 1-1.8-4.1M14.5 3v3h-3"/></svg>Перезагрузка</button>
        <button data-a="shutdown"><svg viewBox="0 0 18 18"><path d="M9 2.5v6M5 5a5.5 5.5 0 1 0 8 0"/></svg>Выключение</button>
      </div>
    </div>

    <!-- вид острова -->
    <div class="pane" id="p-look">
      <h4>Персонаж</h4>
      <div class="sgrid" id="chars"></div>
      <h4>Новый год на острове</h4>
      <div class="set"><span>Когда показывать (по датам: 15 дек – 15 янв)</span><div class="seg" id="sHol"><button data-v="dates">По датам</button><button data-v="always">Всегда</button><button data-v="off">Нет</button></div></div>
      <div class="set"><span>Снег</span><div class="seg" id="sSnow"><button data-v="1">Да</button><button data-v="0">Нет</button></div></div>
      <div class="set"><span>Гирлянда</span><div class="seg" id="sGar"><button data-v="off">Нет</button><button data-v="blink">Мигает</button><button data-v="wave">Волна</button></div></div>
    </div>
    <div class="toast" id="toast"></div>
  </div>
</div>
<script>
(() => {
  'use strict';
  const $ = id => document.getElementById(id);
  const $$ = (s, r = document) => [...r.querySelectorAll(s)];
  const root = $('root');
  let api = null;
  const call = async (n, ...a) => { try { return await api[n](...a); } catch (e) { return null; } };
  const STATES = {
    loading:  ['Запуск', '#9a9cae'], idle: ['Слушаю', '#6ab3f3'], thinking: ['Думаю…', '#f5cf8a'], speaking: ['Говорю', '#7fd6a4'],
    paused:   ['Пауза', '#9a9cae'], error: ['Ошибка', '#ff8a80'], sleep: ['Сплю', '#9a9cae'],
  };
  const st = { state: 'loading', sleeping: false, listening: true, detail: '', name: 'Карина', you: '', reply: '', err: '' };
  let set = { character: 'logo', holiday: 'dates', snow: true, garland: 'off', city: '' };
  let full = false, mode = '', errUntil = 0, toastUntil = 0, toastText = '', level = 0, foldTimer = 0, tab = 'home';

  const clip = (s, n) => { s = String(s || '').replace(/\s+/g, ' ').trim(); return s.length > n ? s.slice(0, n - 1) + '…' : s; };
  const key = () => (st.sleeping && st.state === 'idle') ? 'sleep' : (STATES[st.state] ? st.state : 'idle');

  // ---------- персонажи (свои рисунки) ----------
  const E = (x, y, w, h, r, f) => `<rect class="eye" x="${x}" y="${y}" width="${w}" height="${h}" rx="${r}" fill="${f}"/>`;
  const CHR = {
    eyes:  `<svg viewBox="0 0 32 32">${E(8, 7, 6, 16, 3, '#f3f3f6')}${E(18, 7, 6, 16, 3, '#f3f3f6')}</svg>`,
    spark: `<svg viewBox="0 0 32 32"><circle class="fillc" cx="16" cy="16" r="14"/><circle cx="16" cy="16" r="14" fill="#fff" opacity=".35"/>${E(10.5, 12, 3.4, 7, 1.7, '#1b1b22')}${E(18.1, 12, 3.4, 7, 1.7, '#1b1b22')}</svg>`,
    bot:   `<svg viewBox="0 0 32 32"><circle class="fillc" cx="16" cy="3" r="2"/><path d="M16 5v3" stroke="#bbb" stroke-width="1.5"/><rect x="3" y="8" width="26" height="20" rx="8" fill="#e8e5da"/><rect x="6.5" y="11.5" width="19" height="13" rx="5.5" fill="#15151a"/>${E(10.5, 14.5, 3.6, 6.5, 1.8, 'var(--c)')}${E(17.9, 14.5, 3.6, 6.5, 1.8, 'var(--c)')}</svg>`,
    cat:   `<svg viewBox="0 0 32 32"><path d="M4 14V3l7 5.2h10L28 3v11c0 8-5 13-12 13S4 22 4 14z" fill="#f4f1ea"/>${E(10, 13, 3, 6, 1.5, '#262630')}${E(19, 13, 3, 6, 1.5, '#262630')}<path d="M14.6 21l1.4 1.2 1.4-1.2z" fill="#e58b94"/><path d="M3 20l6 1M3 23l6-1M29 20l-6 1M29 23l-6-1" stroke="#c9c5bb" stroke-width="1"/><circle class="fillc" cx="16" cy="28.5" r="2.4"/></svg>`,
    blob:  `<svg viewBox="0 0 32 32"><path d="M16 5c8 0 13 5 13 12 0 6.5-5 10.5-13 10.5S3 23.500 3 17C3 10 8 5 16 5z" fill="#f2c88f"/><ellipse cx="9" cy="19.500" rx="2.6" ry="1.7" fill="#ee8f8a" opacity=".7"/><ellipse cx="23" cy="19.500" rx="2.6" ry="1.7" fill="#ee8f8a" opacity=".7"/>${E(11, 13, 2.8, 5.5, 1.4, '#4a3320')}${E(18.2, 13, 2.8, 5.5, 1.4, '#4a3320')}</svg>`,
    pixel: `<svg viewBox="0 0 32 32" shape-rendering="crispEdges"><path fill="#ff6a1a" d="M10 4h12v2h4v2h2v18h-4v-4h-4v4h-4v-4h-4v4H8v-4H4v4H2V8h2V6h4V4z"/>${E(9, 11, 5, 6, 0, '#15151a')}${E(18, 11, 5, 6, 0, '#15151a')}</svg>`,
    logo:  `<img src="logo.png" alt="">`,
  };
  function paintChars() {
    const html = CHR[set.character] || CHR.logo;
    $$('[data-chr]').forEach(n => { n.innerHTML = html; });
  }

  // ---------- режим окна ----------
  function wanted() {
    if (full) return 'full';
    if (Date.now() < toastUntil) return 'wide';
    const k = key();
    if (k === 'thinking' || k === 'speaking' || k === 'loading') return 'wide';
    if (k === 'error' && Date.now() < errUntil) return 'wide';
    return 'mini';
  }

  function render() {
    const k = key(), [lab, color] = STATES[k];
    root.style.setProperty('--c', color);
    let sub = '', head = lab;
    if (Date.now() < toastUntil) { head = '🔔'; sub = clip(toastText, 52); }
    else if (k === 'thinking') sub = st.you ? '«' + clip(st.you, 40) + '»' : '';
    else if (k === 'speaking') sub = clip(st.reply, 48);
    else if (k === 'error') sub = clip(st.err || st.detail, 48);
    else if (k === 'loading') sub = clip(st.detail, 40);
    $('cLab').textContent = head; $('cSub').textContent = sub;
    $('chipT').textContent = lab;
    let main = '', small = '';
    if (k === 'idle') { main = `Скажите «${st.name}, …»`; small = st.you ? 'Вы: ' + clip(st.you, 56) : '«открой блокнот», «громкость пятьдесят»'; }
    else if (k === 'thinking') { main = 'Думаю…'; small = st.you ? '«' + clip(st.you, 56) + '»' : ''; }
    else if (k === 'speaking') { main = clip(st.reply, 40) || 'Говорю…'; small = st.you ? 'Вы: ' + clip(st.you, 56) : ''; }
    else if (k === 'paused') { main = 'Микрофон выключен'; small = 'Включите, чтобы продолжить'; }
    else if (k === 'sleep') { main = 'Я сплю'; small = `Скажите «${st.name}, проснись»`; }
    else if (k === 'error') { main = 'Что-то пошло не так'; small = clip(st.err || st.detail, 60); }
    else { main = 'Загружаюсь…'; small = clip(st.detail, 60); }
    $('fMain').textContent = main; $('fSub').textContent = small;
    const mic = $('bMic');
    if (k === 'sleep') { mic.textContent = 'Проснуться'; mic.dataset.act = 'wake'; }
    else if (k === 'paused') { mic.textContent = 'Включить микрофон'; mic.dataset.act = 'on'; }
    else { mic.textContent = 'Выключить микрофон'; mic.dataset.act = 'off'; }
    $('bStop').hidden = k !== 'speaking';
    setMode(wanted());
    root.className = 'm-' + (mode || 'mini') + ' s-' + k;
  }

  function setMode(m) {
    if (m === mode) return;
    mode = m;
    if (api) api.set_mode(m).catch(() => {});
  }

  function toast(text, ms = 5000) {
    toastText = text; toastUntil = Date.now() + ms;
    const t = $('toast'); t.textContent = text; t.classList.add('on');
    setTimeout(() => t.classList.remove('on'), ms);
    render(); setTimeout(render, ms + 80);
  }

  // ---------- события ----------
  window.karina = {
    event(ev) {
      if (!ev) return;
      if (ev.type === 'state') {
        st.state = ev.state; st.detail = ev.detail || '';
        if ('sleeping' in ev) st.sleeping = !!ev.sleeping;
        if ('listening' in ev) st.listening = !!ev.listening;
        if (ev.state === 'error') errUntil = Date.now() + 6000;
        if (ev.state === 'thinking') st.reply = '';
        render();
        if (ev.state === 'error') setTimeout(render, 6100);
      } else if (ev.type === 'level') level = Math.max(0, Math.min(1, (ev.v || 0) * 6));
      else if (ev.type === 'log') {
        if (ev.kind === 'you') { st.you = ev.text || ''; render(); }
        else if (ev.kind === 'karina') { st.reply = ev.text || ''; render(); }
        else if (ev.kind === 'error') { st.err = ev.text || ''; render(); }
      } else if (ev.type === 'toast') { toast((ev.kind === 'timer' ? '⏱ ' : '⏰ ') + ev.text, 8000); if (ev.kind === 'timer') { tEnd = 0; paintTimer(); } if (ev.kind === 'reminder' && tab === 'notes') loadRem(); }
    }
  };

  // ---------- столбики ----------
  const bars = $$('#bars i'), shape = [.55, .85, 1, .85, .55];
  setInterval(() => {
    const k = key(); let a = 0, t = Date.now();
    if (k === 'idle') a = .08 + level * .9 + (Math.sin(t / 700) + 1) * .03;
    else if (k === 'speaking') a = .35 + Math.random() * .6;
    else if (k === 'thinking') a = .25 + .2 * Math.sin(t / 180);
    else if (k === 'loading') a = .2 + .15 * Math.sin(t / 260);
    level *= .8;
    bars.forEach((b, i) => { b.style.height = Math.max(3, Math.round(17 * a * shape[i] * (.7 + Math.random() * .5))) + 'px'; });
  }, 90);

  // ---------- раскрытие, вкладки ----------
  const setFull = v => { full = v; clearTimeout(foldTimer); if (v) openTab(tab); render(); };
  $('compact').addEventListener('click', () => setFull(true));
  $('fold').addEventListener('click', e => { e.stopPropagation(); setFull(false); });
  root.addEventListener('mouseenter', () => clearTimeout(foldTimer));
  root.addEventListener('mouseleave', () => { if (full) { clearTimeout(foldTimer); foldTimer = setTimeout(() => { if (!document.activeElement || !/INPUT|TEXTAREA/.test(document.activeElement.tagName)) setFull(false); }, 6000); } });
  $('tabs').addEventListener('click', e => { const b = e.target.closest('.tab'); if (b) openTab(b.dataset.t); });
  function openTab(t) {
    tab = t;
    $$('.tab').forEach(b => b.classList.toggle('on', b.dataset.t === t));
    $$('.pane').forEach(p => p.classList.toggle('on', p.id === 'p-' + t));
    if (t === 'home') loadVol();
    if (t === 'notes') { loadNote(); loadRem(); loadTimer(); }
    if (t === 'clip') loadClip();
    if (t === 'weather') loadWeather();
    if (t === 'system') loadSys();
    if (t === 'look') paintLook();
  }

  // ---------- главная ----------
  $('bMic').addEventListener('click', async () => { const a = $('bMic').dataset.act; if (a === 'wake') await call('wake_up'); else await call('set_listening', a === 'on'); });
  $('bStop').addEventListener('click', () => call('hush'));
  $('bOpen').addEventListener('click', () => call('open_main'));
  const vol = $('vol'), fillRange = () => vol.style.setProperty('--p', vol.value + '%');
  async function loadVol() { const v = await call('volume_get'); if (v != null) { vol.value = v; $('volV').textContent = v; fillRange(); } }
  vol.addEventListener('input', () => { $('volV').textContent = vol.value; fillRange(); clearTimeout(vol._t); vol._t = setTimeout(() => call('volume_set', +vol.value), 60); });
  let muted = false;
  $('bMute').addEventListener('click', async () => { muted = !muted; await call('mute_set', muted); $('bMute').style.color = muted ? '#ff8a80' : ''; });
  $('bShot').addEventListener('click', async () => { const r = await call('screenshot'); toast(r && r.ok ? 'Снимок сохранён в Изображения\\Karina' : 'Не получилось: ' + ((r && r.error) || ''), 4000); });
  $('bShots').addEventListener('click', () => call('open_shots'));

  // ---------- заметка, таймер, напоминания ----------
  let noteT = 0, tEnd = 0, tTotal = 300, tSel = 300;
  async function loadNote() { const n = $('note'); if (document.activeElement !== n) n.value = (await call('note_get')) || ''; }
  $('note').addEventListener('input', () => { clearTimeout(noteT); noteT = setTimeout(() => call('note_set', $('note').value), 500); });
  const fmt = s => Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
  function paintTimer() {
    const left = tEnd ? Math.max(0, Math.round((tEnd - Date.now()) / 1000)) : tSel;
    $('tTime').textContent = fmt(left);
    $('rFg').style.strokeDashoffset = String(238.8 * (tEnd ? 1 - left / tTotal : 0));
    $('tGo').textContent = tEnd ? 'Стоп' : 'Старт';
    if (tEnd && left <= 0) { tEnd = 0; }
  }
  async function loadTimer() { const t = await call('timer_get'); if (t) { tEnd = Date.now() + t.left * 1000; tTotal = t.total; } else tEnd = 0; paintTimer(); }
  setInterval(() => { if (tab === 'notes' && full) paintTimer(); }, 500);
  $('presets').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; tSel = +b.dataset.m * 60; if (!tEnd) { tTotal = tSel; paintTimer(); } });
  $('tGo').addEventListener('click', async () => {
    if (tEnd) { await call('timer_stop'); tEnd = 0; } else { tTotal = tSel; await call('timer_start', tSel); tEnd = Date.now() + tSel * 1000; }
    paintTimer();
  });
  async function loadRem() {
    const list = (await call('reminders_get')) || [], box = $('rem'); box.textContent = '';
    if (!list.length) { const d = document.createElement('div'); d.innerHTML = '<span class="muted">Пока пусто</span>'; box.append(d); return; }
    list.forEach(r => {
      const d = document.createElement('div'), s = document.createElement('span'), sm = document.createElement('small'), x = document.createElement('button');
      s.textContent = r.what; sm.textContent = r.when + (r.repeat ? ' ↻' : ''); x.textContent = '✕'; x.title = 'Удалить';
      x.onclick = async () => { await call('reminder_del', r.id); loadRem(); };
      d.append(s, sm, x); box.append(d);
    });
  }
  $('remIn').addEventListener('keydown', async e => {
    if (e.key !== 'Enter' || !$('remIn').value.trim()) return;
    const r = await call('reminder_add', $('remIn').value);
    if (r && r.ok) { $('remIn').value = ''; toast('Напомню ' + r.reminder.when, 2500); loadRem(); } else toast((r && r.error) || 'Не получилось', 4500);
  });

  // ---------- буфер ----------
  async function loadClip() {
    const list = (await call('clip_get')) || [], box = $('clip'); box.textContent = '';
    if (!list.length) { const d = document.createElement('div'); d.className = 'empty'; d.textContent = 'Здесь появится то, что вы скопируете. История хранится только в памяти, пока работает Карина.'; box.append(d); return; }
    list.forEach((t, i) => { const b = document.createElement('button'); b.textContent = t.replace(/\s+/g, ' '); b.title = 'Скопировать снова'; b.onclick = async () => { await call('clip_copy', i); toast('Скопировано', 1500); }; box.append(b); });
    const c = document.createElement('button'); c.textContent = 'Очистить историю'; c.style.cssText = 'text-align:center;color:#ff8a80'; c.onclick = async () => { await call('clip_clear'); loadClip(); }; box.append(c);
  }

  // ---------- погода ----------
  function cityForm(msg) {
    return `<div class="${msg ? '' : 'wcity'}">` + (msg ? `<div class="muted" style="margin-bottom:8px">${msg}</div><div class="wcity">` : '') +
      `<input class="inp" id="wCity" placeholder="Город: Казань, Berlin, Алматы…"><button class="btn p" id="wGo">Найти</button>` + (msg ? '</div>' : '') + '</div>';
  }
  async function loadWeather(city) {
    const body = $('wBody'); body.innerHTML = '<div class="empty" style="height:200px">Загружаю…</div>';
    const r = await call('weather_get', city || '');
    if (!r || !r.ok) {
      body.innerHTML = cityForm(!r ? 'Нет связи' : r.need_city ? 'Где показывать погоду? Город запомнится.' : (r.error || 'Не получилось'));
    } else {
      const d = r.days.map(x => `<div class="wd"><div class="muted">${x.day.split(' ')[0]}</div><div class="i">${x.icon}</div><b>${x.hi}°</b><span class="muted">${x.lo}°</span></div>`).join('');
      body.innerHTML = `<div class="wnow"><div class="ico">${r.now.icon}</div><div><div class="big">${r.now.t}°</div></div><div><b>${r.city}</b><div class="muted">${r.now.text}, ощущается ${r.now.feels}°, ветер ${r.now.wind} м/с</div></div></div><div class="wdays">${d}</div>` + `<div class="wcity" style="margin-top:12px"><input class="inp" id="wCity" placeholder="Другой город…"><button class="btn" id="wGo">Сменить</button></div>`;
    }
    const go = () => { const v = $('wCity').value.trim(); if (v) loadWeather(v); };
    $('wGo').onclick = go; $('wCity').onkeydown = e => { if (e.key === 'Enter') go(); };
  }

  // ---------- система ----------
  const IC = {
    wifi: '<svg viewBox="0 0 20 20"><path d="M2.5 8a10 10 0 0 1 15 0M5 11a6.500 6.500 0 0 1 10 0M7.500 14a3 3 0 0 1 5 0"/><circle cx="10" cy="16.500" r=".6"/></svg>',
    bt: '<svg viewBox="0 0 20 20"><path d="M6 6l8 8-4 3.500V2.500L14 6l-8 8"/></svg>',
    dark: '<svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="7"/><path d="M10 3v14" /></svg>',
    vpn: '<svg viewBox="0 0 20 20"><path d="M10 2.500l6 2.200v4.800c0 4-2.700 6.500-6 8-3.300-1.500-6-4-6-8V4.700z"/></svg>',
    bat: '<svg viewBox="0 0 20 20"><rect x="2.500" y="6" width="13" height="8" rx="2"/><path d="M17.500 8.500v3"/></svg>',
  };
  async function loadSys() {
    const s = (await call('sys_get')) || {}, box = $('tiles');
    const b = s.battery;
    const tiles = [
      ['wifi', IC.wifi, 'Wi-Fi', s.wifi ? s.wifi : 'Не подключён', !!s.wifi],
      ['bluetooth', IC.bt, 'Bluetooth', 'Открыть настройки', false],
      ['dark', IC.dark, 'Тёмная тема', s.dark == null ? '—' : (s.dark ? 'Включена' : 'Выключена'), !!s.dark],
      ['vpn', IC.vpn, 'VPN', s.vpn ? 'Включён' : 'Выключен', !!s.vpn],
      ['bat', IC.bat, 'Батарея', b && b.has ? b.pct + '%' + (b.plugged ? ', от сети' : '') : 'Питание от сети', false],
    ];
    box.textContent = '';
    tiles.forEach(([id, ic, name, sub, on]) => {
      const t = document.createElement('button'); t.className = 'tile' + (on ? ' on' : '');
      t.innerHTML = ic + `<div><b>${name}</b><small>${sub}</small></div>`;
      if (id !== 'bat') t.onclick = async () => { const r = await call('sys_action', id); if (r && r.ok === false) toast(r.error || 'Не получилось', 4000); setTimeout(loadSys, id === 'vpn' ? 1500 : 400); };
      box.append(t);
    });
  }
  $('power').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    const a = b.dataset.a;
    if (a === 'lock' || a === 'sleep') { call('sys_action', a); return; }
    if (b.classList.contains('ask')) { call('sys_action', a); return; }
    const old = b.innerHTML; b.classList.add('ask'); b.innerHTML = 'Нажмите ещё раз';
    setTimeout(() => { b.classList.remove('ask'); b.innerHTML = old; }, 3000);
  });

  // ---------- вид острова ----------
  const CNAMES = { logo: 'Карина', eyes: 'Глазки', spark: 'Искра', bot: 'Бот', cat: 'Котик', blob: 'Капля', pixel: 'Пиксель' };
  function paintLook() {
    const g = $('chars'); g.textContent = '';
    Object.keys(CNAMES).forEach(k => {
      const b = document.createElement('button'); b.className = k === set.character ? 'on' : '';
      b.innerHTML = `<span class="chr lg" style="background:#000;border-radius:9px">${CHR[k]}</span>${CNAMES[k]}`;
      b.onclick = () => save({ character: k }); g.append(b);
    });
    [['sHol', set.holiday], ['sSnow', set.snow ? '1' : '0'], ['sGar', set.garland]].forEach(([id, v]) => $$('#' + id + ' button').forEach(b => b.classList.toggle('on', b.dataset.v === v)));
  }
  $('sHol').onclick = e => { const b = e.target.closest('button'); if (b) save({ holiday: b.dataset.v }); };
  $('sSnow').onclick = e => { const b = e.target.closest('button'); if (b) save({ snow: b.dataset.v === '1' }); };
  $('sGar').onclick = e => { const b = e.target.closest('button'); if (b) save({ garland: b.dataset.v }); };
  async function save(p) { Object.assign(set, p); applyLook(); paintLook(); const r = await call('settings_set', p); if (r) { set = r; applyLook(); paintLook(); } }

  // ---------- праздник: снег и гирлянда ----------
  function holidayOn() {
    if (set.holiday === 'always') return true;
    if (set.holiday !== 'dates') return false;
    const d = new Date(), m = d.getMonth() + 1, day = d.getDate();
    return (m === 12 && day >= 15) || (m === 1 && day <= 15);
  }
  const cv = $('snow'), cx = cv.getContext('2d'); let flakes = [], snowRun = false;
  function applyLook() {
    paintChars();
    const h = holidayOn();
    const gar = $('garland'); gar.hidden = !(h && set.garland !== 'off');
    gar.className = 'garland g-' + set.garland;
    if (!gar.children.length) for (let i = 0; i < 24; i++) { const e = document.createElement('i'); e.style.setProperty('--k', i); gar.append(e); }
    const snow = h && set.snow; cv.hidden = !snow;
    if (snow && !snowRun) { snowRun = true; requestAnimationFrame(snowLoop); }
    if (!snow) snowRun = false;
  }
  function snowLoop() {
    if (!snowRun) return;
    const w = root.clientWidth, h = root.clientHeight, dpr = window.devicePixelRatio || 1;
    if (cv.width !== Math.round(w * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
    cx.setTransform(dpr, 0, 0, dpr, 0, 0); cx.clearRect(0, 0, w, h);
    const want = Math.max(6, Math.round(w * h / (mode === 'full' ? 5200 : 1800)));
    while (flakes.length < want) flakes.push({ x: Math.random() * w, y: Math.random() * h, r: .7 + Math.random() * 1.4, v: .25 + Math.random() * .6, p: Math.random() * 6 });
    flakes.length = want;
    cx.fillStyle = 'rgba(255,255,255,' + (mode === 'full' ? .45 : .8) + ')';
    for (const f of flakes) {
      f.y += f.v; f.p += .03; f.x += Math.sin(f.p) * .25;
      if (f.y > h + 2) { f.y = -2; f.x = Math.random() * w; }
      cx.beginPath(); cx.arc(f.x, f.y, f.r, 0, 6.3); cx.fill();
    }
    setTimeout(() => requestAnimationFrame(snowLoop), 33);
  }

  async function init() {
    api = window.pywebview.api;
    const s = await call('get_state');
    if (s) { st.state = s.state || 'idle'; st.sleeping = !!s.sleeping; st.listening = s.listening !== false; st.name = s.name || 'Карина'; if (s.settings) set = s.settings; if (s.volume != null) { vol.value = s.volume; $('volV').textContent = s.volume; fillRange(); } }
    mode = ''; applyLook(); render();
  }
  applyLook(); fillRange(); render();
  if (window.pywebview && window.pywebview.api) init(); else window.addEventListener('pywebviewready', init);
})();
</script>
</body>
</html>
